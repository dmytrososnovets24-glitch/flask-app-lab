{% extends 'base.html' %}

{% block content %}
<div class="container text-center mt-4">
    <p class="display-4 text-danger mb-2">{{ code or 404 }}</p>
    <h2>{{ title }}</h2>
    <p class="lead">{{ message or 'На жаль, сторінки, яку ви шукаєте, не існує.' }}</p>
    <a href="{{ url_for('main.home') }}" class="btn btn-primary mt-3">На головну</a>
</div>
{% endblock %}
